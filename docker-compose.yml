services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: threatlens
      POSTGRES_USER: threatlens
      POSTGRES_PASSWORD: threatlens_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatlens -d threatlens"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://threatlens:threatlens_dev_password@db:5432/threatlens
      JWT_SECRET: change-this-demo-secret-before-real-use
      UPLOAD_DIR: /data/uploads
      MAX_FILE_SIZE_MB: 20
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./storage:/data/uploads
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
